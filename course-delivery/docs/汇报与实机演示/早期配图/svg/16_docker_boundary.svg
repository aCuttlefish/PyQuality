<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Docker 执行边界与部署结构</title><desc>展示运行不可信候选代码时实际使用的隔离措施。 默认验收要求 Docker，开发豁免只适用于可信本地代码。</desc><defs><marker id="arrow-087B4B" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087B4B"/></marker><marker id="arrow-286681" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#286681"/></marker><marker id="arrow-C77B2B" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#C77B2B"/></marker><marker id="arrow-B74646" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#B74646"/></marker><marker id="arrow-153C32" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#153C32"/></marker><marker id="arrow-62776F" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#62776F"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="64" y="48" width="8" height="72" rx="0" fill="#087B4B" stroke="none" stroke-width="0"/><text x="96" y="66" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">PYQUALITY  /  软件工程课程设计</text><text x="96" y="116" fill="#153C32" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start">Docker 执行边界与部署结构</text><text x="1532" y="65" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="end">16</text>