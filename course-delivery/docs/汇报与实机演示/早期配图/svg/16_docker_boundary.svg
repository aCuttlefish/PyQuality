 CJK SC, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Docker 容器：python:3.10-slim</text><rect x="875" y="280" width="610" height="112" rx="8" fill="#EEF5F8" stroke="#286681" stroke-width="1.6"/><text x="1180" y="317" fill="#286681" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">harness 与待测 Python 代码</text><text x="1180" y="356" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">从输入区复制到临时工作区执行</text><rect x="875" y="445" width="610" height="247" rx="0" fill="#FFFFFF" stroke="#B9CEC2" stroke-width="1.4"/><rect x="875" y="445" width="610" height="46" rx="0" fill="#087B4B" stroke="none" stroke-width="0"/><text x="891" y="480" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">隔离项</text><text x="1067.9" y="480" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">当前配置</text><rect x="875" y="491" width="610" height="67" rx="0" fill="#F4F8F5" stroke="none" stroke-width="0"/><text x="891" y="525" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">账户与权限</text><text x="1067.9" y="525" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">UID / GID 65534，移除能力</text><line x1="875" y1="558" x2="1485" y2="558" stroke="#B9CEC2" stroke-width="1"/><text x="891" y="592" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">网络与文件</text><text x="1067.9" y="592" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">无网络，只读根文件系统</text><line x1="875" y1="625" x2="1485" y2="625" stroke="#B9CEC2" stroke-width="1"/><rect x="875" y="625" width="610" height="67" rx="0" fill="#F4F8F5" stroke="none" stroke-width="0"/><text x="891" y="659" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">资源限制</text><text x="1067.9" y="659" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">1 CPU / 512 MiB / 64 PID</text><line x1="875" y1="692" x2="1485" y2="692" stroke="#B9CEC2" stroke-width="1"/><line x1="1051.9" y1="491" x2="1051.9" y2="692" stroke="#B9CEC2" stroke-width="1"/><polyline points="615,341 875,341" fill="none" stroke="#087B4B" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-087B4B)"/><text x="745" y="320" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle">启动任务</text><polyline points="835,658 720,658 720,550 615,550" fill="none" stroke="#286681" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-286681)"/><text x="746" y="690" fill="#286681" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle">写出观察</text><rect x="64" y="778" width="1472" height="46" rx="5" fill="#EDF6F0" stroke="none" stroke-width="0"/><text x="88" y="809" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">超时后清理本轮容器。上述措施降低风险，不构成对任意恶意代码的完备安全保证。</text></svg>