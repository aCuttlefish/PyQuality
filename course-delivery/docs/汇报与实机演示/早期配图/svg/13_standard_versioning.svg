<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>标准确认与版本绑定</title><desc>解释同标准复验的成立条件以及修改标准后的失效规则。 标准不依赖候选代码；代码改变后需重新执行，不复用旧执行结果。</desc><defs><marker id="arrow-087B4B" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#087B4B"/></marker><marker id="arrow-286681" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#286681"/></marker><marker id="arrow-C77B2B" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#C77B2B"/></marker><marker id="arrow-B74646" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#B74646"/></marker><marker id="arrow-153C32" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#153C32"/></marker><marker id="arrow-62776F" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#62776F"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="64" y="48" width="8" height="72" rx="0" fill="#087B4B" stroke="none" stroke-width="0"/><text x="96" y="66" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">PYQUALITY  /  软件工程课程设计</text><text x="96" y="116" fill="#153C32" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start">标准确认与版本绑定</text><text x="1532" y="65" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="end">13</text><line x1="64" y1="142" x2="1536" y2="142" stroke="#B9CEC2" stroke-width="1.4"/><text x="64" y="863" fill="#62776F" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">核心机制</text><text x="1536" y="863" fill="#62776F" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">PyQuality v4.3  ·  2026-11-15</text><rect x="80" y="225" width="350" height="180" rx="8" fill="#EDF6F0" stroke="#087B4B" stroke-width="1.6"/><text x="255" y="262" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">人工确认标准</text><text x="255" y="301" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">需求 R + 函数入口</text><text x="255" y="333.4" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">spec + plan + 范围声明</text><rect x="625" y="225" width="350" height="180" rx="8" fill="#EDF6F0" stroke="#087B4B" stroke-width="1.6"/><text x="800" y="262" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">保存确认身份</text><text x="800" y="301" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">STD-&lt;id&gt;</text><text x="800" y="333.4" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">spec_hash / plan_hash</text><rect x="1170" y="225" width="350" height="180" rx="8" fill="#EDF6F0" stroke="#087B4B" stroke-width="1.6"/><text x="1345" y="262" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">执行代码版本 C₁</text><text x="