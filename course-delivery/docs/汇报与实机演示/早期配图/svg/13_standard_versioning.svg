x="1355" y="577" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">代码版本 C₂</text><text x="1355" y="616" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">新 code_hash</text><text x="1355" y="648.4" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">证据 E₂ 与 E₁ 对照</text><polyline points="800,405 800,478 315,478 315,540" fill="none" stroke="#C77B2B" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-C77B2B)"/><polyline points="800,478 877,478 877,540" fill="none" stroke="#087B4B" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-087B4B)"/><polyline points="1080,615 1190,615" fill="none" stroke="#087B4B" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-087B4B)"/><rect x="64" y="778" width="1472" height="46" rx="5" fill="#EDF6F0" stroke="none" stroke-width="0"/><text x="88" y="809" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">同标准对照要求 spec_hash 与 plan_hash 相同；执行证据还必须匹配当前 code_hash。</text></svg>