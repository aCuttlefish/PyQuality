3</text><line x1="64" y1="142" x2="1536" y2="142" stroke="#B9CEC2" stroke-width="1.4"/><text x="64" y="863" fill="#62776F" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">测试与演示</text><text x="1536" y="863" fill="#62776F" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">PyQuality v4.3  ·  2026-11-15</text><text x="90" y="205" fill="#62776F" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">公开项目：Sarthak-Sidhant/week · 作者声明借助 Copilot 开发</text><rect x="80" y="270" width="340" height="210" rx="8" fill="#EDF6F0" stroke="#087B4B" stroke-width="1.6"/><text x="250" y="307" fill="#087B4B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">正常业务输入</text><text x="250" y="346" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle">体重 70 kg</text><text x="250" y="381.1" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle">身高 1.75 m</text><text x="250" y="416.2" fill="#263D37" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle">预期 BMI ≈ 22.857143</text><rect x="585" y="270" width="410" height="210" rx="8" fill="#FFF4E7" stroke="#C77B2B" stroke-width="1.4"/><text x="607" y="305" fill="#C77B2B" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">原程序的转换行为</text><text x="609" y="354" fill="#C77B2B" font-family="Consolas, Microsoft YaHei, monospace" font-size="30" font-weight="400" text-anchor="start">int('1.75')</text><text x="609" y="390" fill="#C77B2B" font-family="Consolas, Microsoft YaHei, monospace" font-size=